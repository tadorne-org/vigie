; Firmware du nœud énergie Vigie (ESP32-WROOM-32E) et passerelle de test.
;
;   pio run -e devkit -t upload      devkit nue : capteur simulé par défaut
;   pio run -e vigie  -t upload      carte Vigie 1.0 : INA226, repli simulateur si absent
;   pio run -e gateway -t upload     récepteur ESP-NOW de banc (2e ESP32)
;   pio run -e devkit -t uploadfs    (inutile : l'interface web est embarquée)

[platformio]
default_envs = devkit

[env]
; pioarduino, Arduino-ESP32 3.3.11 / ESP-IDF 5.5 (version figée pour la reproductibilité)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = esp32dev
board_build.flash_size = 4MB
board_build.partitions = partitions_vigie.csv
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 921600
build_unflags = -std=gnu++11 -std=gnu++17
build_flags =
    -std=gnu++2a
    -Wall
    -Isrc/common
    -DCORE_DEBUG_LEVEL=1
    -DVIGIE_FW_VERSION=\"0.1.0\"

[env:devkit]
build_src_filter = +<node/> +<common/>
build_flags = ${env.build_flags}
    -DVIGIE_BOARD_DEVKIT=1

[env:vigie]
build_src_filter = +<node/> +<common/>
build_flags = ${env.build_flags}
    -DVIGIE_BOARD_V1=1

[env:gateway]
build_src_filter = +<gateway/> +<common/>
board_build.partitions = default.csv

baseURL = "https://vigie.tadorne.org/"
title = "Vigie"
enableRobotsTXT = true
enableEmoji = false
disableKinds = ["taxonomy", "term"]
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
summaryLength = 25
timeZone = "Europe/Paris"

[params]
  parentName = "Tadorne"
  parentURL = "https://tadorne.org/"
  motto = "duck engineering"
  # Contact address shown on the site (footer, design and about pages).
  contact = "contact@tadorne.org"
  # Section holding dated notes, per language (paths differ EN/FR).
  logSection = "/log"
  gpgFingerprint = "5420 08E3 53EC A628 B4D6  ACAD 8C03 243A FF69 5BF7"
  gpgUid = "Tadorne <contact@tadorne.org>"
  gpgURL = "https://tadorne.org/verify/"
  # Public repository: site source and published design files.
  sourceURL = "https://github.com/tadorne-org/vigie"
  ogImage = "/img/tadorne-logo.svg"
  # Vigie is public: search engines may index every page and robots.txt opens
  # the door, sitemap included. Set back to false to close the site again.
  seoIndexable = true

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    style = "github"
    lineNos = false
    tabWidth = 2
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  page = ["HTML"]

[languages]

  [languages.en]
    locale = "en-GB"
    label = "English"
    direction = "ltr"
    contentDir = "content/en"
    weight = 1
    title = "Vigie"
    [languages.en.params]
      description = "An always-on energy node for small boats: one board that measures the battery, watches through the winter and reports from the bilge. A Tadorne project."
    [languages.en.menus]
      [[languages.en.menus.main]]
        name = "Project"
        pageRef = "/project"
        weight = 10
      [[languages.en.menus.main]]
        name = "Roadmap"
        pageRef = "/roadmap"
        weight = 20
      [[languages.en.menus.main]]
        name = "Log"
        pageRef = "/log"
        weight = 30
      [[languages.en.menus.main]]
        name = "Documentation"
        pageRef = "/documentation"
        weight = 35
      [[languages.en.menus.main]]
        name = "Design"
        pageRef = "/design"
        weight = 40
      [[languages.en.menus.main]]
        name = "About"
        pageRef = "/about"
        weight = 50

  [languages.fr]
    locale = "fr-FR"
    label = "Français"
    direction = "ltr"
    contentDir = "content/fr"
    weight = 2
    title = "Vigie"
    [languages.fr.params]
      description = "Un nœud d'énergie toujours vivant pour petits voiliers : une carte qui mesure la batterie, veille tout l'hiver et rend compte depuis la cale. Un projet Tadorne."
      logSection = "/journal"
    [languages.fr.menus]
      [[languages.fr.menus.main]]
        name = "Projet"
        pageRef = "/projet"
        weight = 10
      [[languages.fr.menus.main]]
        name = "Feuille de route"
        pageRef = "/feuille-de-route"
        weight = 20
      [[languages.fr.menus.main]]
        name = "Journal"
        pageRef = "/journal"
        weight = 30
      [[languages.fr.menus.main]]
        name = "Documentation"
        pageRef = "/documentation"
        weight = 35
      [[languages.fr.menus.main]]
        name = "Conception"
        pageRef = "/conception"
        weight = 40
      [[languages.fr.menus.main]]
        name = "À propos"
        pageRef = "/a-propos"
        weight = 50
